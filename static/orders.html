<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Apex Commerce</title>
  <meta name="description" content="Track and manage your purchases.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/index.css">
  <link rel="stylesheet" href="/static/pages.css">
</head>
<body>

<header class="navbar scrolled" id="navbar">
  <div id="shared-nav"></div>
</header>

<main class="page-main">
  <div class="page-header">
    <div>
      <h1 class="page-title">My Orders</h1>
      <p class="page-sub">Track and manage your purchases</p>
    </div>
    <a href="/products" class="btn-primary" style="text-decoration:none">+ Shop More</a>
  </div>

  <div id="orders-wrap">
    <!-- Injected dynamically -->
  </div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">⚡ APEX COMMERCE</div>
    <div class="footer-links">
      <a href="/products">Products</a>
      <a href="/orders">My Orders</a>
      <a href="/tracking">Order Tracking</a>
    </div>
    <p class="footer-copy">Designed & Built with FastAPI · SQLAlchemy · Redis</p>
  </div>
</footer>

<div id="shared-modals"></div>

<script src="/static/shared.js"></script>
<script>
const STATUS_STEPS = ['pending', 'confirmed', 'processing', 'shipped', 'delivered'];
const STATUS_LABELS = {
  pending:    'Order Placed',
  confirmed:  'Confirmed',
  processing: 'Processing',
  shipped:    'Shipped',
  delivered:  'Delivered',
  cancelled:  'Cancelled',
};
const STATUS_ICONS = {
  pending:    '🕐',
  confirmed:  '✅',
  processing: '⚙️',
  shipped:    '🚚',
  delivered:  '📦',
  cancelled:  '❌',
};
const STATUS_COLORS = {
  pending:    'status-amber',
  confirmed:  'status-blue',
  processing: 'status-purple',
  shipped:    'status-blue',
  delivered:  'status-green',
  cancelled:  'status-red',
};

document.addEventListener('DOMContentLoaded', async () => {
  injectSharedUI('orders');
  if (!isLoggedIn()) {
    showNotLoggedIn();
    return;
  }
  await loadOrders();
});

function showNotLoggedIn() {
  document.getElementById('orders-wrap').innerHTML = `
    <div class="empty-orders">
      <div class="empty-orders-icon">🔒</div>
      <h2>Sign in to view your orders</h2>
      <p>You need to be signed in to track your purchases.</p>
      <button class="btn-primary" onclick="openAuthModal(loadOrders)">Sign In</button>
    </div>`;
}

async function loadOrders() {
  const wrap = document.getElementById('orders-wrap');
  wrap.innerHTML = `<div class="orders-loading">
    <div class="skeleton-card" style="height:160px"></div>
    <div class="skeleton-card" style="height:160px"></div>
  </div>`;

  if (!isLoggedIn()) { showNotLoggedIn(); return; }

  const data = await api('GET', '/orders/');
  if (data._err) {
    wrap.innerHTML = `<div class="empty-orders">
      <div class="empty-orders-icon">⚠️</div>
      <p>${data._err}</p>
    </div>`;
    return;
  }

  const orders = Array.isArray(data) ? data : (data.items || []);

  if (!orders.length) {
    wrap.innerHTML = `
      <div class="empty-orders">
        <div class="empty-orders-icon">🛍️</div>
        <h2>No orders yet</h2>
        <p>Your purchase history will appear here after you place your first order.</p>
        <a href="/products" class="btn-primary" style="text-decoration:none;display:inline-block">Browse Products →</a>
      </div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="orders-summary-bar">
      <div class="summary-stat">
        <span class="s-num">${orders.length}</span>
        <span class="s-label">Total Orders</span>
      </div>
      <div class="summary-stat">
        <span class="s-num">$${orders.reduce((s, o) => s + (o.total_amount || 0), 0).toFixed(2)}</span>
        <span class="s-label">Total Spent</span>
      </div>
      <div class="summary-stat">
        <span class="s-num">${orders.filter(o => o.status === 'delivered').length}</span>
        <span class="s-label">Delivered</span>
      </div>
    </div>
    <div class="orders-list">
      ${orders.map(o => renderOrder(o)).join('')}
    </div>`;
}

function renderOrder(order) {
  const status = order.status || 'pending';
  const statusClass = STATUS_COLORS[status] || 'status-amber';
  const stepIndex = STATUS_STEPS.indexOf(status);
  const isCancelled = status === 'cancelled';
  const date = new Date(order.created_at).toLocaleDateString('en-US', {
    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
  });
  const items = order.items || [];

  return `
  <div class="order-card" id="order-${order.id}">
    <div class="order-header" onclick="toggleOrder(${order.id})">
      <div class="order-meta">
        <div class="order-id">${order.order_number || `#ORD-${order.id}`}</div>
        <div class="order-date">${date}</div>
      </div>
      <div class="order-mid">
        <div class="order-items-preview">
          ${items.slice(0, 3).map(i => `<span class="item-pill">${i.product_name || 'Item'}</span>`).join('')}
          ${items.length > 3 ? `<span class="item-pill">+${items.length - 3} more</span>` : ''}
        </div>
      </div>
      <div class="order-right">
        <div class="order-total">$${(order.total_amount || 0).toFixed(2)}</div>
        <span class="status-badge ${statusClass}">${STATUS_ICONS[status]} ${STATUS_LABELS[status] || status}</span>
        <a href="/tracking?id=${order.id}" class="view-btn" onclick="event.stopPropagation()" style="text-decoration:none">Track →</a>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </div>
    </div>

    <div class="order-detail" id="detail-${order.id}">
      <!-- Timeline -->
      ${!isCancelled ? `
      <div class="timeline">
        ${STATUS_STEPS.map((s, i) => `
          <div class="timeline-step ${i <= stepIndex ? 'done' : ''} ${i === stepIndex ? 'current' : ''}">
            <div class="tl-dot">
              ${i < stepIndex ? '✓' : i === stepIndex ? '●' : ''}
            </div>
            <div class="tl-label">${STATUS_LABELS[s]}</div>
          </div>
          ${i < STATUS_STEPS.length - 1 ? `<div class="tl-line ${i < stepIndex ? 'done' : ''}"></div>` : ''}
        `).join('')}
      </div>` : `
      <div class="cancelled-banner">❌ This order was cancelled</div>`}

      <!-- Items -->
      <div class="order-items-section">
        <h4 class="order-section-title">Items Ordered</h4>
        <div class="order-items-list">
          ${items.length ? items.map(item => `
            <div class="order-item">
              <div class="oi-icon">📦</div>
              <div class="oi-info">
                <div class="oi-name">${item.product_name || 'Product'}</div>
                <div class="oi-variant">${item.variant_name || ''}</div>
              </div>
              <div class="oi-right">
                <div class="oi-qty">×${item.quantity}</div>
                <div class="oi-price">$${((item.unit_price || 0) * item.quantity).toFixed(2)}</div>
              </div>
            </div>`).join('')
          : '<p class="no-items">No item details available.</p>'}
        </div>
        <div class="order-totals">
          <div class="ot-row"><span>Subtotal</span><span>$${(order.total_amount || 0).toFixed(2)}</span></div>
          <div class="ot-row"><span>Shipping</span><span class="text-green">Free</span></div>
          <div class="ot-row ot-total"><span>Total</span><span>$${(order.total_amount || 0).toFixed(2)}</span></div>
        </div>
      </div>

      <!-- Shipping -->
      ${order.shipping_address ? `
      <div class="order-shipping-section">
        <h4 class="order-section-title">Shipping Address</h4>
        <div class="shipping-card">
          <div class="shipping-icon">📍</div>
          <div>
            <div>${order.shipping_address.street || ''}</div>
            <div>${order.shipping_address.city || ''}, ${order.shipping_address.state || ''} ${order.shipping_address.zip || ''}</div>
            <div>${order.shipping_address.country || ''}</div>
          </div>
        </div>
      </div>` : ''}
    </div>
  </div>`;
}

function toggleOrder(id) {
  const detail = document.getElementById(`detail-${id}`);
  const card   = document.getElementById(`order-${id}`);
  detail.classList.toggle('open');
  card.classList.toggle('expanded');
}
</script>
</body>
</html>
