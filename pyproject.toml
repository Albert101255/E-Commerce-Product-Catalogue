[tool.poetry]
name = "anti-gravity"
version = "0.1.0"
description = "E-commerce REST API built with FastAPI and PostgreSQL"
authors = ["Albert <albert@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = {extras = ["email"], version = "^2.4.0"}
pydantic-settings = "^2.0.3"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.23"}
asyncpg = "^0.31.0"
alembic = "^1.12.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "^4.0.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-multipart = "^0.0.6"
redis = "^5.0.1"
stripe = "^15.3.1"
elasticsearch = "^9.4.1"
celery = "^5.6.3"
nest-asyncio = "^1.6.0"
prometheus-client = "^0.25.0"
sentry-sdk = "^2.66.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.1"
black = "^23.11.0"
ruff = "^0.1.5"
mypy = "^1.7.0"
aiosqlite = "^0.22.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "."
]
asyncio_mode = "auto"
